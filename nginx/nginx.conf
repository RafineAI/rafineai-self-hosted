# RafineAI single-port reverse proxy.
#   /api  -> api (FastAPI management backend)
#   /v1   -> gateway (OpenAI-compatible LLM proxy, for external clients too)
#   /     -> panel (Next.js)

upstream rafine_api     { server api:8000; }
upstream rafine_gateway { server gateway:8080; }
upstream rafine_panel   { server panel:3000; }

server {
    listen 80;
    server_name _;

    # Allow large prompt payloads.
    client_max_body_size 25m;

    # Stack health: proxied to the api (proves api + db reachable).
    location = /healthz {
        proxy_pass http://rafine_api/healthz;
    }

    # Management API.
    location /api/ {
        proxy_pass http://rafine_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
        # Required for Server-Sent Events (streaming chat endpoint).
        proxy_buffering off;
        proxy_cache off;
    }

    # OpenAI-compatible gateway (external API clients use this directly).
    location /v1/ {
        proxy_pass http://rafine_gateway;
        proxy_set_header Host              $host;
        proxy_set_header Authorization     $http_authorization;
        proxy_read_timeout 130s;
    }

    # Panel (Next.js) — everything else.
    location / {
        proxy_pass http://rafine_panel;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Support Next.js HMR/websocket in dev.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
