# ============================================================
#  RafineAI Self-Hosted — development stack (build from source).
#  Usage: docker compose -f docker-compose.dev.yml up --build
# ============================================================
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    environment:
      GATEWAY_PORT: "8080"
      DATABASE_URL: ${DATABASE_URL}
      RAFINE_MASTER_KEY: ${RAFINE_MASTER_KEY}
      GATEWAY_SYNC_INTERVAL_SEC: ${GATEWAY_SYNC_INTERVAL_SEC:-30}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      API_PORT: "8000"
      DATABASE_URL: ${DATABASE_URL}
      RAFINE_MASTER_KEY: ${RAFINE_MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET}
      OWNER_EMAIL: ${OWNER_EMAIL}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      GATEWAY_URL: http://gateway:8080
      RAFINE_PUBLIC_URL: ${RAFINE_PUBLIC_URL}
      STORAGE_DIR: /data/storage
    ports:
      - "8000:8000"
    volumes:
      - storage_dev:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

  panel:
    build:
      context: .
      dockerfile: panel/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ""
    ports:
      - "3000:3000"
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - panel
      - api
      - gateway

volumes:
  pgdata_dev:
  storage_dev:
