name: Docker Hub Release

# Build and push gateway/api/panel images to a private Docker Hub repository.
# Runs alongside release.yml (GHCR). Requires the DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN repository secrets — see docs/DEPLOYMENT.md for setup.
# Skips cleanly (no-op) if those secrets are not configured.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push (defaults to 'manual')"
        required: false
        default: "manual"

env:
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  images:
    runs-on: ubuntu-latest
    if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - name: gateway
            context: ./gateway
            dockerfile: gateway/Dockerfile
          - name: api
            context: .
            dockerfile: api/Dockerfile
          - name: panel
            context: .
            dockerfile: panel/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tag
        id: tag
        run: echo "value=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.name }}:${{ steps.tag.outputs.value }}
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.name }}:latest
