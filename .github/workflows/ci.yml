name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Test (race) & vet
        working-directory: gateway
        run: |
          go vet ./...
          go test -race ./...

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image so RAG migration 0014 can enable the extension
        # (matches the production/dev compose Postgres image).
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rafineai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        working-directory: api
        run: pip install -r requirements-dev.txt
      - name: Pytest
        working-directory: api
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rafineai_test
        run: pytest -q

  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install & build
        working-directory: panel
        run: |
          npm install
          npm run lint
          npm run build
